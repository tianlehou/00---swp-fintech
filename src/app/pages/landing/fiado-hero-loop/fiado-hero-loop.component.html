<div
  class="loop-stage"
  [class.is-playing]="playing()"
  [class.is-finished]="finished()"
  [attr.data-view]="currentView()"
  role="img"
  [attr.aria-label]="subtitle()"
>
  <div class="phone-frame" aria-hidden="true">
  @for (cue of cues; track cue.view; let i = $index) {
    <img
      class="loop-slide"
      [class.is-active]="sceneIndex() === i"
      [src]="cue.image"
      [alt]="cue.t"
      width="390"
      height="844"
      loading="eager"
      decoding="async"
    />
  }
  </div>

  <div class="loop-chrome">
    <p class="loop-caption" aria-live="polite">{{ subtitle() }}</p>
    <div class="loop-meter" aria-hidden="true">
      <span class="loop-meter-fill" [style.width.%]="progressPct()"></span>
    </div>
    <div class="loop-controls">
      <button type="button" class="loop-btn" (click)="togglePlay()">
        @if (playing()) {
          Pausar
        } @else if (finished()) {
          Volver a ver
        } @else {
          Reproducir
        }
      </button>
    </div>
  </div>
</div>
